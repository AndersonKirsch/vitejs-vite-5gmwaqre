# ---------------------------------------------------------------------
# Mantem o projeto do Supabase ativo.
#
# O plano gratuito do Supabase pausa o projeto quando ele fica uma semana
# sem receber consultas. Esta rotina faz uma consulta por dia, sozinha,
# para que o relogio de inatividade nunca chegue la.
#
# Nao precisa de manutencao. Para testar na hora, va em Actions >
# "Manter Supabase ativo" > "Run workflow".
# ---------------------------------------------------------------------
name: Manter Supabase ativo

on:
  schedule:
    # Todos os dias as 11:00 UTC (08:00 no horario de Cuiaba).
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: https://jaimifedvocxvqixladd.supabase.co
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "ERRO: o segredo SUPABASE_ANON_KEY nao esta configurado no repositorio."
            echo "Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

          codigo=$(curl -sS -o /tmp/resposta.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/imoveis?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")

          echo "HTTP $codigo"
          echo "Resposta: $(cat /tmp/resposta.txt)"

          # 200 e o esperado. Com RLS ligado a resposta vem vazia ([]),
          # mas a consulta chegou ao banco, que e o que conta como atividade.
          if [ "$codigo" != "200" ]; then
            echo "A consulta nao chegou ao banco. Projeto pode estar pausado."
            exit 1
          fi

          echo "OK - atividade registrada no banco."
